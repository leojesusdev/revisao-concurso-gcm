      color: #0F172A;

      font-family: 'Plus Jakarta Sans', sans-serif;

<body class="min-h-screen flex flex-col antialiased selection:bg-royal-600 selection:text-white">

  <!-- ===================================================================== -->
  <!-- STICKY HEADER: APENAS CONTROLES SOLICITADOS                           -->
  <!-- (Desempenho, Temporizador, Nota de Corte e Limpar Respostas)          -->
  <!-- ===================================================================== -->
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-3 space-y-3">

      <!-- Linha Superior: Título do Simulado, Temporizador e Limpar Respostas -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-navy-900 text-sky-400 flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined filled">computer</span>
          </div>
          <div>
            <h1 class="text-base sm:text-lg font-extrabold text-navy-900 leading-tight">
              Simulado de Noções de Informática — FGV
            </h1>
            <p class="text-xs text-slate-500">
              Questões 25 a 32 • Guarda Civil Municipal de Salvador (Tipo 1 - Branca)
            </p>
          </div>
        </div>

        <!-- Controles: Temporizador e Botão Limpar Respostas -->
        <div class="flex flex-wrap items-center gap-2">
          <!-- 1. TEMPORIZADOR (Iniciar, Pausar, Reiniciar) -->
          <div class="inline-flex items-center gap-1 bg-slate-100 border border-slate-300 rounded-xl px-2.5 py-1.5" title="Temporizador">
            <span class="material-symbols-outlined text-royal-600 text-base">timer</span>
            <span id="timer-display" class="font-mono text-xs sm:text-sm font-extrabold text-navy-900 px-1.5">00:00:00</span>
            <button type="button" id="btn-timer-start" onclick="startTimer()" title="Iniciar temporizador" class="p-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white transition flex items-center justify-center">
              <span class="material-symbols-outlined text-sm">play_arrow</span>
            </button>
            <button type="button" id="btn-timer-pause" onclick="pauseTimer()" title="Pausar temporizador" class="p-1 rounded-lg bg-amber-500 hover:bg-amber-600 text-white transition flex items-center justify-center hidden">
              <span class="material-symbols-outlined text-sm">pause</span>
            </button>
            <button type="button" onclick="resetTimer()" title="Reiniciar temporizador" class="p-1 rounded-lg bg-slate-200 hover:bg-slate-300 text-slate-700 transition flex items-center justify-center">
              <span class="material-symbols-outlined text-sm">replay</span>
            </button>
          </div>

          <!-- 4. BOTÃO LIMPAR RESPOSTAS -->
          <button type="button" id="btn-clear-answers" onclick="handleClearResponses()" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-bold transition">
            <span class="material-symbols-outlined text-base">delete_sweep</span>
            <span id="clear-btn-label">Limpar respostas</span>
          </button>
        </div>
      </div>

      <!-- Linha Inferior: 2. DESEMPENHO & 3. DESEMPENHO DE ACORDO COM A NOTA DE CORTE -->
      <div class="grid grid-cols-1 md:grid-cols-12 gap-2.5 pt-2 border-t border-slate-100">
        <!-- Painel de Desempenho em Tempo Real (Respondidas, Acertos, Erros, Aproveitamento) -->
        <div class="md:col-span-6 bg-slate-50 border border-slate-200/90 rounded-2xl px-3.5 py-2.5 flex items-center justify-between gap-2">
          <div class="text-center flex-1">
            <span class="block text-[10px] font-bold uppercase tracking-wider text-slate-500">Respondidas</span>
            <span id="stat-answered" class="text-sm sm:text-base font-extrabold text-navy-900">0 / 8</span>
          </div>
          <div class="w-px h-7 bg-slate-200"></div>
          <div class="text-center flex-1">
            <span class="block text-[10px] font-bold uppercase tracking-wider text-emerald-700">Acertos</span>
            <span id="stat-correct" class="text-sm sm:text-base font-extrabold text-emerald-700">0</span>
          </div>
          <div class="w-px h-7 bg-slate-200"></div>
          <div class="text-center flex-1">
            <span class="block text-[10px] font-bold uppercase tracking-wider text-rose-600">Erros</span>
            <span id="stat-wrong" class="text-sm sm:text-base font-extrabold text-rose-600">0</span>
          </div>
          <div class="w-px h-7 bg-slate-200"></div>
          <div class="text-center flex-1">
            <span class="block text-[10px] font-bold uppercase tracking-wider text-royal-600">Aproveitamento</span>
            <span id="stat-pct" class="text-sm sm:text-base font-extrabold text-royal-700">0%</span>
          </div>
        </div>

        <!-- Painel de Nota de Corte (Mínimo 50% • 4 acertos de 8 questões) -->
        <div id="cutoff-card" class="md:col-span-6 bg-slate-50 border border-slate-200/90 rounded-2xl px-3.5 py-2.5 flex flex-col justify-center">
          <div class="flex items-center justify-between gap-2 mb-1.5">
            <span class="text-[11px] font-bold text-slate-600">
              Nota de Corte (Mín. 50% • 4/8 acertos):
            </span>
            <span id="cutoff-badge" class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold bg-rose-100 text-rose-700 whitespace-nowrap">
              Faltam 4 acertos para o corte
            </span>
          </div>
          <div class="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden relative">
            <!-- Marcador visual dos 50% (4 acertos de 8) -->
            <div class="absolute top-0 bottom-0 left-1/2 w-0.5 bg-navy-900/60 z-10" title="Linha de Corte: 50% (4 acertos)"></div>
            <div id="cutoff-bar" class="h-full bg-rose-500 transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>
      </div>

    </div>
  </header>

  <!-- ===================================================================== -->
  <!-- CONTEÚDO PRINCIPAL: APENAS AS 8 QUESTÕES OFICIAIS DE INFORMÁTICA      -->
  <!-- ===================================================================== -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
    <div id="questions-container" class="space-y-6">
      <!-- Renderizado via JavaScript -->
    </div>
  </main>

  <!-- ===================================================================== -->

  <!-- ===================================================================== -->
  <script>

    // =========================================================================

        options: {
          A: 'adicionar o teclado apropriado nas Opções de Idioma do Português (Brasil).',

        explanation: '<strong>Gabarito Oficial FGV: (C).</strong> No MS Excel 2016 BR, toda fórmula deve obrigatoriamente iniciar com o sinal de igual (<code>=</code>), e o operador aritmético de exponenciação (potência) é o acento circunflexo (<code>^</code>). Como o enunciado pede para calcular a potência do <em>conteúdo da célula B1 elevado ao conteúdo da célula B2</em> (permitindo recálculo dinâmico caso os valores mudem), a fórmula correta é <code>=B1^B2</code>. As opções (A) e (D) não possuem o sinal <code>=</code>; a (B) usa operador de Python/Fortran (<code>**</code>); e a (E) fixa constantes literais em vez de referenciar as células.'

        num: 32,
        tema: 'Armazenamento de Dados • Cálculo de Capacidade e Unidades de Medida',
        enunciado: 'Uma regra bastante usada entre as editoras de livros diz que um livro contém 25 linhas por página e 60 caracteres por linha. Suponha que você quer armazenar, na forma de texto não compactado, o conteúdo de quatro livros de 500 páginas contendo apenas texto, e que um dos dispositivos a seguir será usado exclusivamente para essa finalidade.<br><br>Assinale a opção que indica o dispositivo que oferece espaço suficiente para a tarefa com o menor desperdício de espaço livre.',
        visualHTML: null,
        options: {
          A: 'Disquete de 360 KB.',
          B: 'Disquete de 1.44 MB.',
          C: 'CD-R de 650 MB.',
          D: 'DVD-R de 4.7 GB.',
          E: 'Disco rígido de 1 TB.'
        },
        answer: 'C',
        explanation: '<strong>Gabarito Oficial FGV: (C).</strong> Vamos calcular o tamanho total em bytes:<br>• 1 página = 25 linhas × 60 caracteres = <strong>1.500 caracteres (bytes)</strong>.<br>• 1 livro de 500 páginas = 500 × 1.500 = <strong>750.000 bytes</strong>.<br>• 4 livros = 4 × 750.000 = <strong>3.000.000 bytes</strong> (aproximadamente <strong>2,86 MiB</strong> ou <strong>3 MB</strong>).<br><br>Comparando com as mídias listadas:<br>• <strong>(A) Disquete de 360 KB</strong> (~0,36 MB): insuficiente.<br>• <strong>(B) Disquete de 1.44 MB</strong>: insuficiente (comporta menos da metade dos ~2,86 MB necessários).<br>• <strong>(C) CD-R de 650 MB</strong>: <strong>suficiente</strong> e é a menor capacidade entre as opções viáveis, gerando o <strong>menor desperdício de espaço livre</strong> em comparação ao DVD-R (4.7 GB) e ao HD (1 TB).'
      }
    ];

    // =========================================================================
    // ESTADO DA APLICAÇÃO (PERSISTÊNCIA EM LOCALSTORAGE)
    // =========================================================================
    const STORAGE_ANSWERS_KEY = 'gcm_informatica_2019_answers';
    const STORAGE_TIMER_KEY = 'gcm_informatica_2019_timer';

    let userAnswers = JSON.parse(localStorage.getItem(STORAGE_ANSWERS_KEY) || '{}');
    let timerSeconds = parseInt(localStorage.getItem(STORAGE_TIMER_KEY) || '0', 10);
    let timerInterval = null;
    let isTimerRunning = false;
    let clearConfirmPending = false;
    let clearConfirmTimeout = null;

    // =========================================================================
    // 1. CONTROLE DO TEMPORIZADOR (CRONÔMETRO PROGRESSIVO HH:MM:SS)
    // =========================================================================
    function formatTime(sec) {
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function updateTimerUI() {
      document.getElementById('timer-display').textContent = formatTime(timerSeconds);
      const btnStart = document.getElementById('btn-timer-start');
      const btnPause = document.getElementById('btn-timer-pause');

      if (isTimerRunning) {
        btnStart.classList.add('hidden');
        btnPause.classList.remove('hidden');
      } else {
        btnStart.classList.remove('hidden');
        btnPause.classList.add('hidden');
      }
    }

    function startTimer() {
      if (isTimerRunning) return;
      isTimerRunning = true;
      updateTimerUI();
      timerInterval = setInterval(() => {
        timerSeconds++;
        localStorage.setItem(STORAGE_TIMER_KEY, String(timerSeconds));
        updateTimerUI();
      }, 1000);
    }

    function pauseTimer() {
      isTimerRunning = false;
      clearInterval(timerInterval);
      updateTimerUI();
    }

    function resetTimer() {
      pauseTimer();
      timerSeconds = 0;
      localStorage.setItem(STORAGE_TIMER_KEY, '0');
      updateTimerUI();
    }

    // =========================================================================
    // 2. DESEMPENHO EM TEMPO REAL & 3. DESEMPENHO NA NOTA DE CORTE (50% = 4/8)
    // =========================================================================
    function updateDashboard() {
      const totalQuestions = INFORMATICA_QUESTIONS.length; // 8 questões
      const minCutoffScore = 4; // 50% de 8 questões = 4 acertos

      let answered = 0;
      let correct = 0;
      let wrong = 0;

      INFORMATICA_QUESTIONS.forEach(q => {
        const chosen = userAnswers[q.num];
        if (chosen) {
          answered++;
          if (chosen === q.answer) correct++;
          else wrong++;
        }
      });

      const pct = Math.round((correct / totalQuestions) * 100);

      document.getElementById('stat-answered').textContent = `${answered} / ${totalQuestions}`;
      document.getElementById('stat-correct').textContent = correct;
      document.getElementById('stat-wrong').textContent = wrong;
      document.getElementById('stat-pct').textContent = `${pct}%`;

      // Atualização visual da Nota de Corte (mínimo 4 acertos de 8)
      const cutoffBadge = document.getElementById('cutoff-badge');
      const cutoffBar = document.getElementById('cutoff-bar');
      const cutoffCard = document.getElementById('cutoff-card');

      const barWidth = Math.min(100, Math.round((correct / totalQuestions) * 100));
      cutoffBar.style.width = `${barWidth}%`;

      if (correct >= minCutoffScore) {
        cutoffBadge.textContent = `Atingiu/superou o corte (${correct}/8 acertos)`;
        cutoffBadge.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-extrabold bg-emerald-100 text-emerald-800 whitespace-nowrap';
        cutoffBar.className = 'h-full bg-emerald-600 transition-all duration-300';
        cutoffCard.className = 'md:col-span-6 bg-emerald-50/70 border border-emerald-300 rounded-2xl px-3.5 py-2.5 flex flex-col justify-center';
      } else {
        const missing = minCutoffScore - correct;
        const plural = missing === 1 ? 'falta 1 acerto' : `faltam ${missing} acertos`;
        cutoffBadge.textContent = `Abaixo do corte (${plural})`;
        cutoffBadge.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-extrabold bg-rose-100 text-rose-700 whitespace-nowrap';
        cutoffBar.className = 'h-full bg-rose-500 transition-all duration-300';
        cutoffCard.className = 'md:col-span-6 bg-slate-50 border border-slate-200/90 rounded-2xl px-3.5 py-2.5 flex flex-col justify-center';
      }
    }

    // =========================================================================
    // 4. INTERAÇÃO COM AS QUESTÕES & BOTÃO LIMPAR RESPOSTAS (2 CLIQUES)
    // =========================================================================
    function selectOption(qNum, letter) {
      // Inicia automaticamente o cronômetro no primeiro clique se ainda estiver zerado e parado
      if (!isTimerRunning && timerSeconds === 0 && Object.keys(userAnswers).length === 0) {
        startTimer();
      }

      userAnswers[qNum] = letter;
      localStorage.setItem(STORAGE_ANSWERS_KEY, JSON.stringify(userAnswers));
      renderQuestions();
      updateDashboard();
    }

    function handleClearResponses() {
      const btnLabel = document.getElementById('clear-btn-label');
      const btn = document.getElementById('btn-clear-answers');

      if (!clearConfirmPending) {
        clearConfirmPending = true;
        btnLabel.textContent = 'Confirmar limpeza?';
        btn.className = 'inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white border border-rose-700 text-xs font-bold transition shadow-sm';
        clearConfirmTimeout = setTimeout(() => {
          clearConfirmPending = false;
          btnLabel.textContent = 'Limpar respostas';
          btn.className = 'inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-bold transition';
        }, 3500);
        return;
      }

      // Executa a limpeza imediata de respostas e zera o armazenamento
      clearTimeout(clearConfirmTimeout);
      clearConfirmPending = false;
      btnLabel.textContent = 'Limpar respostas';
      btn.className = 'inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-bold transition';

      userAnswers = {};
      localStorage.removeItem(STORAGE_ANSWERS_KEY);

      renderQuestions();
      updateDashboard();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // =========================================================================
    // RENDERIZAÇÃO DAS 8 QUESTÕES OFICIAIS DE INFORMÁTICA (QUESTÕES 25 A 32)
    // =========================================================================
    function renderQuestions() {
      const container = document.getElementById('questions-container');
      if (!container) return;

      container.innerHTML = INFORMATICA_QUESTIONS.map(q => {
        const chosen = userAnswers[q.num];
        const isAnswered = !!chosen;

        let statusBadge = '';
        if (isAnswered) {
          if (chosen === q.answer) {
            statusBadge = `<span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-extrabold bg-emerald-100 text-emerald-800"><span class="material-symbols-outlined text-sm">check_circle</span> Acertou</span>`;
          } else {
            statusBadge = `<span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-extrabold bg-rose-100 text-rose-700"><span class="material-symbols-outlined text-sm">cancel</span> Errou (Gabarito: ${q.answer})</span>`;
          }
        }

        return `
          <article class="bg-white rounded-3xl p-5 sm:p-7 border border-slate-200 shadow-sm space-y-4">
            <!-- Cabeçalho da Questão -->
            <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100">
              <div class="flex items-center gap-3">
                <span class="w-9 h-9 rounded-xl bg-navy-900 text-white font-extrabold text-sm flex items-center justify-center shrink-0">
                  ${q.num}
                </span>
                <div>
                  <span class="text-[11px] font-bold uppercase tracking-wider text-royal-600">Noções de Informática • FGV (PMS-BA 2019)</span>
                  <h2 class="text-xs sm:text-sm font-semibold text-slate-600">${q.tema}</h2>
                </div>
              </div>
              <div>${statusBadge}</div>
            </div>

            <!-- Enunciado -->
            <div class="text-sm sm:text-base text-slate-900 leading-relaxed font-medium">
              ${q.enunciado}
            </div>

            <!-- Representação Visual da Questão (quando houver) -->
            ${q.visualHTML ? `<div>${q.visualHTML}</div>` : ''}

            <!-- Alternativas A a E -->
            <div class="space-y-2.5 pt-1">
              ${['A', 'B', 'C', 'D', 'E'].map(letter => {
                const isSelected = chosen === letter;
                const isCorrect = q.answer === letter;

                let btnClass = 'border-slate-200 hover:border-royal-600 hover:bg-slate-50 text-slate-800';
                let letterClass = 'bg-slate-100 text-navy-900';

                if (isAnswered) {
                  if (isCorrect) {
                    btnClass = 'border-emerald-500 bg-emerald-50/90 text-emerald-950 font-semibold';
                    letterClass = 'bg-emerald-600 text-white';
                  } else if (isSelected && !isCorrect) {
                    btnClass = 'border-rose-500 bg-rose-50/90 text-rose-950';
                    letterClass = 'bg-rose-600 text-white';
                  } else {
                    btnClass = 'border-slate-200 bg-slate-50/50 text-slate-500';
                  }
                }

                return `
                  <button type="button" onclick="selectOption(${q.num}, '${letter}')" class="w-full text-left p-3.5 rounded-2xl border-2 transition flex items-start gap-3 ${btnClass}">
                    <span class="w-7 h-7 rounded-lg text-xs font-extrabold flex items-center justify-center shrink-0 mt-0.5 ${letterClass}">
                      ${letter}
                    </span>
                    <span class="text-sm leading-snug flex-1">${q.options[letter]}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Explicação Fundamentada após Responder -->
            ${isAnswered ? `
              <div class="mt-4 p-4 sm:p-5 rounded-2xl bg-slate-50 border border-slate-200 space-y-2">
                <div class="flex items-center gap-1.5 text-xs font-extrabold uppercase tracking-wider text-navy-900">
                  <span class="material-symbols-outlined text-base text-amber-600">fact_check</span>
                  Comentário Oficial (Gabarito Definitivo GCM — Tipo 1)
                </div>
                <p class="text-xs sm:text-sm text-slate-700 leading-relaxed">
                  ${q.explanation}
                </p>
              </div>
            ` : ''}
          </article>
        `;
      }).join('');
    }

    // Inicialização
    window.addEventListener('DOMContentLoaded', () => {
      updateTimerUI();
      renderQuestions();
      updateDashboard();
    });
  </script>
</body>
</html>
